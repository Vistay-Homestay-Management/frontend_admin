name: CI

on:
  push:
    branches: [dev, test, main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint --if-present
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/vistay-homestay-management/frontend_admin
          tags: |
            type=sha,prefix=sha-
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=raw,value=test,enable=${{ github.ref == 'refs/heads/test' }}
      - uses: docker/build-push-action@v6
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: ${{ github.event_name == 'push' }}
          sbom: ${{ github.event_name == 'push' }}
      - name: Promote tested image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/vistay-homestay-management/frontend_admin:latest \
            --tag ghcr.io/vistay-homestay-management/frontend_admin:sha-${{ github.sha }} \
            ghcr.io/vistay-homestay-management/frontend_admin:test
